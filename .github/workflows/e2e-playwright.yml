# Manual E2E only — no run on push, PR, or merge.
name: E2E Playwright

on:
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project (farm / overview / all). Languages is a separate toggle.
        required: true
        default: all
        type: choice
        options:
          - all
          - farm
          - overview
          - i18n
      languages:
        description: Include language suite (i18n). Slack /xlm-test-overview → /overview runs languages only (project=i18n).
        required: true
        # Quote on/off — unquoted YAML 1.1 treats them as booleans; API then rejects string "on".
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      grep:
        description: Optional --grep (e.g. @contract, @health)
        required: false
        default: ''
      target:
        description: dev or staging — URLs, APIs, and locale branch come from configs/targets.json
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
      xlm_slack_notify:
        description: Post run summary to Slack (XLM_SLACK_NOTIFY)
        required: true
        # Quote on/off — unquoted YAML 1.1 treats them as booleans; workflow_dispatch API rejects non-string choice values (same pitfall as `languages`).
        default: "on"
        type: choice
        options:
          - "on"
          - "off"

permissions:
  id-token: write   # required for AWS OIDC assume-role
  contents: read

jobs:
  e2e:
    name: Playwright
    # Playwright 1.56.1 has no Chromium build for ubuntu-26.04 (current ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout e2e
        uses: actions/checkout@v4

      - name: Resolve target
        id: target
        env:
          E2E_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const targets = require("./configs/targets.json");
            const name = String(process.env.E2E_TARGET || "dev").trim().toLowerCase();
            const target = targets[name];
            if (!target) {
              console.error("Unknown target \"" + name + "\". Use dev or staging.");
              process.exit(1);
            }
            const fields = {
              app_url: target.appUrl,
              api_base_url: target.apiBaseUrl,
              cube_api_url: target.cubeApiUrl,
              admin_url: target.adminUrl,
              ref: target.dashboardRef,
            };
            for (const [key, value] of Object.entries(fields)) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, key + "=" + value + "\n");
            }
            console.log("Target " + name + ": " + target.appUrl + " locales@" + target.dashboardRef);
          '

      # Locale JSON for i18n specs (lib/i18n/locales.ts → DASHBOARD_ROOT).
      # Private sibling repo: set secret DASHBOARD_CHECKOUT_TOKEN (PAT with contents:read).
      - name: Checkout dashboard locales
        if: >-
          github.event.inputs.languages == 'on' ||
          github.event.inputs.project == 'i18n'
        uses: actions/checkout@v4
        with:
          repository: Xsights-Development/xlm-dashboard
          ref: ${{ steps.target.outputs.ref }}
          path: xahwm-dashboard
          token: ${{ secrets.DASHBOARD_CHECKOUT_TOKEN || github.token }}
          sparse-checkout: |
            src/locales/lang
          sparse-checkout-cone-mode: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Session Manager plugin
        run: |
          set -euo pipefail
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        env:
          CI: true
          E2E_TARGET: ${{ github.event.inputs.target }}
          # Locale JSON root for i18n (sibling checkout path)
          DASHBOARD_ROOT: ${{ github.workspace }}/xahwm-dashboard
          # Tenant, farm, location, and timezone come from configs/targets.json via E2E_TARGET.
          # Repository secrets (Settings → Actions → Secrets)
          APP_USER: ${{ vars.APP_USER }}
          APP_PASS: ${{ secrets.APP_PASS }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          # Staging DB (read-only) — Playwright reads to verify tests
          # Reached via SSM port-forward → connect over localhost, not the real host.
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STAGING_EC2_INSTANCE_ID: ${{ secrets.STAGING_EC2_INSTANCE_ID }}
          STAGING_DB_REMOTE_HOST: ${{ secrets.STAGING_DB_REMOTE_HOST }}   # real RDS endpoint (tunnel target)
          STAGING_DB_HOST: localhost                                # tests connect through the tunnel
          STAGING_DB_PORT: '5432'
          STAGING_DB_SSLMODE: require
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_READONLY_USER: ${{ secrets.STAGING_DB_READONLY_USER }}
          STAGING_DB_READONLY_PASS: ${{ secrets.STAGING_DB_READONLY_PASS }}
        run: |
          set -euo pipefail
          if [ "${E2E_TARGET}" != "dev" ] && [ "${E2E_TARGET}" != "staging" ]; then
            echo "::error::E2E_TARGET must be dev or staging (got '${E2E_TARGET}')"
            exit 1
          fi

          PROJECT="${{ github.event.inputs.project }}"
          LANGUAGES="${{ github.event.inputs.languages }}"
          GREP="${{ github.event.inputs.grep }}"

          RUN_I18N=false
          if [ "$LANGUAGES" = "on" ] || [ "$PROJECT" = "i18n" ]; then
            RUN_I18N=true
          fi

          if [ "$RUN_I18N" = "true" ]; then
            LOCALE_SAMPLE="${DASHBOARD_ROOT}/src/locales/lang/en.json"
            if [ ! -f "$LOCALE_SAMPLE" ]; then
              echo "::error::Missing $LOCALE_SAMPLE — checkout dashboard locales failed or dashboard_ref is wrong. For a private dashboard repo, add secret DASHBOARD_CHECKOUT_TOKEN."
              exit 1
            fi
            echo "DASHBOARD_ROOT=$DASHBOARD_ROOT (dashboard_ref=${{ steps.target.outputs.ref }})"
          fi

          # --- Open SSM port-forward to RDS in THIS shell so it lives for the test run ---
          aws ssm start-session \
            --target "$STAGING_EC2_INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$STAGING_DB_REMOTE_HOST\"],\"portNumber\":[\"5432\"],\"localPortNumber\":[\"5432\"]}" \
            > /tmp/ssm-tunnel.log 2>&1 &
          SSM_PID=$!
          # always kill the tunnel on exit (success or failure)
          trap 'kill "$SSM_PID" 2>/dev/null || true' EXIT
          # wait up to 30s for the local port (bash /dev/tcp — no nc dependency)
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then exec 3>&- 3<&-; echo "tunnel up"; break; fi
            if ! kill -0 "$SSM_PID" 2>/dev/null; then
              echo "::error::SSM session exited early"; cat /tmp/ssm-tunnel.log; exit 1
            fi
            sleep 1
          done
          if ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
            echo "::error::SSM tunnel did not open on localhost:5432"; cat /tmp/ssm-tunnel.log; exit 1
          fi
          exec 3>&- 3<&- 2>/dev/null || true
          echo "Using E2E_TARGET=${E2E_TARGET} (${{ steps.target.outputs.app_url }})"
          CMD=(npx playwright test)

          # Select Playwright projects: base suite + optional languages (i18n).
          if [ "$PROJECT" = "i18n" ]; then
            CMD+=(--project=i18n)
          elif [ "$PROJECT" = "all" ]; then
            CMD+=(--project=farm --project=overview)
            if [ "$LANGUAGES" = "on" ]; then
              CMD+=(--project=i18n)
            fi
          else
            CMD+=(--project="$PROJECT")
            if [ "$LANGUAGES" = "on" ]; then
              CMD+=(--project=i18n)
            fi
          fi

          if [ -n "$GREP" ]; then
            CMD+=(--grep "$GREP")
          fi
          echo "Running: ${CMD[*]} (languages=${LANGUAGES})"
          "${CMD[@]}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: |
            reports/
            results/
          retention-days: 14

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload HTML report to R2
        if: always()
        id: r2_report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_REPORT_TOKEN: ${{ secrets.R2_REPORT_TOKEN }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "uploaded=false" >> "$GITHUB_OUTPUT"
          echo "report_url=" >> "$GITHUB_OUTPUT"

          if [ ! -f reports/html/index.html ]; then
            echo "No reports/html/index.html — skip R2 upload"
            exit 0
          fi

          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -z "${R2_BUCKET:-}" ] && missing+=(R2_BUCKET)
          [ -z "${R2_REPORT_TOKEN:-}" ] && missing+=(R2_REPORT_TOKEN)
          [ -z "${R2_PUBLIC_BASE:-}" ] && missing+=(R2_PUBLIC_BASE)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::R2 upload skipped, missing: ${missing[*]}"
            exit 0
          fi

          content_type() {
            case "${1##*.}" in
              html|htm) echo "text/html; charset=utf-8" ;;
              js|mjs) echo "text/javascript; charset=utf-8" ;;
              css) echo "text/css; charset=utf-8" ;;
              json) echo "application/json" ;;
              png) echo "image/png" ;;
              jpg|jpeg) echo "image/jpeg" ;;
              gif) echo "image/gif" ;;
              svg) echo "image/svg+xml" ;;
              webp) echo "image/webp" ;;
              woff) echo "font/woff" ;;
              woff2) echo "font/woff2" ;;
              txt|md) echo "text/plain; charset=utf-8" ;;
              *) echo "application/octet-stream" ;;
            esac
          }

          while IFS= read -r -d '' file; do
            rel="${file#reports/html/}"
            case "${rel##*.}" in
              webm|mp4|zip)
                echo "skip ${rel}"
                continue
                ;;
            esac
            key="runs/${RUN_ID}/${rel}"
            npx --yes wrangler@4 r2 object put "${R2_BUCKET}/${key}" \
              --file="$file" \
              --content-type="$(content_type "$rel")" \
              --remote
          done < <(find reports/html -type f -print0)

          base="${R2_PUBLIC_BASE%/}"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          {
            echo "report_url<<EOF"
            echo "${base}/r/${R2_REPORT_TOKEN}/${RUN_ID}/index.html"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Uploaded HTML report for run ${RUN_ID}"

      - name: Notify Slack
        if: always() && github.event.inputs.xlm_slack_notify != 'off'
        env:
          XLM_SLACK_NOTIFY: ${{ github.event.inputs.xlm_slack_notify }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ steps.e2e.outcome || job.status }}
          INPUT_PROJECT: ${{ github.event.inputs.project }}
          INPUT_GREP: ${{ github.event.inputs.grep }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.r2_report.outputs.report_url }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          GIT_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          APP_URL_HOST: ${{ steps.target.outputs.app_url }}
        run: bash scripts/slack-e2e-notify.sh
