# Manual E2E only — no run on push, PR, or merge.
name: E2E Playwright

on:
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project
        required: true
        default: all
        type: choice
        options:
          - all
          - farm
          - overview
      grep:
        description: Optional --grep (e.g. @contract, @health)
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: true
          # Repository variables (Settings → Actions → Variables)
          APP_URL: ${{ vars.APP_URL }}
          APP_TENANT_IDENTIFIER: ${{ vars.APP_TENANT_IDENTIFIER }}
          APP_FARM_IDENTIFIER: ${{ vars.APP_FARM_IDENTIFIER }}
          APP_LOCATION_TYPE: ${{ vars.APP_LOCATION_TYPE }}
          APP_LOCATION_IDENTIFIER: ${{ vars.APP_LOCATION_IDENTIFIER }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CUBE_API_URL: ${{ vars.CUBE_API_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          APP_API_FARM_IDENTIFIER: ${{ vars.APP_API_FARM_IDENTIFIER }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          # Repository secrets (Settings → Actions → Secrets)
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASS: ${{ secrets.APP_PASS }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ]; then
            echo "::error::APP_URL is empty — add repository variable APP_URL (not secret)"
            exit 1
          fi
          echo "Using APP_URL host: $(echo "$APP_URL" | sed -E 's|^(https?://[^/]+).*|\1|')"
          CMD=(npx playwright test)
          PROJECT="${{ github.event.inputs.project }}"
          GREP="${{ github.event.inputs.grep }}"
          if [ "$PROJECT" != "all" ]; then
            CMD+=(--project="$PROJECT")
          fi
          if [ -n "$GREP" ]; then
            CMD+=(--grep "$GREP")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: |
            reports/
            results/
          retention-days: 14

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skip Slack notification"
            exit 0
          fi
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PROJECT="${{ github.event.inputs.project }}"
          GREP="${{ github.event.inputs.grep }}"
          if [ "$STATUS" = "success" ]; then
            COLOR="#36a64f"
            EMOJI=":white_check_mark:"
            RESULT="Success"
          else
            COLOR="#dc3545"
            EMOJI=":x:"
            RESULT="Failure"
          fi
          JUNIT_SUMMARY=""
          if [ -f reports/junit.xml ]; then
            JUNIT_SUMMARY=$(python3 -c "import xml.etree.ElementTree as ET;r=ET.parse('reports/junit.xml').getroot();suites=list(r.iter('testsuite'));t=sum(int(s.attrib.get('tests',0)) for s in suites);f=sum(int(s.attrib.get('failures',0)) for s in suites);e=sum(int(s.attrib.get('errors',0)) for s in suites);d=f+e;print('%d passed, %d failed (%d total)'%(max(t-d,0),d,t))" 2>/dev/null || true)
          fi
          PAYLOAD=$(jq -n \
            --arg emoji "$EMOJI" \
            --arg result "$RESULT" \
            --arg project "$PROJECT" \
            --arg grep "$GREP" \
            --arg url "$RUN_URL" \
            --arg color "$COLOR" \
            --arg junit "$JUNIT_SUMMARY" \
            '{
              text: ($emoji + " E2E Playwright — " + $result),
              attachments: [{
                color: $color,
                fields: [
                  {title: "Project", value: $project, short: true},
                  {title: "Grep", value: (if $grep == "" then "(none)" else $grep end), short: true},
                  {title: "Result", value: $result, short: true},
                  {title: "Tests", value: (if $junit == "" then "n/a" else $junit end), short: true},
                  {title: "Run", value: $url, short: false}
                ]
              }]
            }')
          curl -sS -f -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed (check SLACK_WEBHOOK_URL)"
