# Manual E2E only — no run on push, PR, or merge.
name: E2E Playwright

on:
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project
        required: true
        default: all
        type: choice
        options:
          - all
          - farm
          - overview
      grep:
        description: Optional --grep (e.g. @contract, @health)
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: true
          # Repository variables (Settings → Actions → Variables)
          APP_URL: ${{ vars.APP_URL }}
          APP_TENANT_IDENTIFIER: ${{ vars.APP_TENANT_IDENTIFIER }}
          APP_FARM_IDENTIFIER: ${{ vars.APP_FARM_IDENTIFIER }}
          APP_LOCATION_TYPE: ${{ vars.APP_LOCATION_TYPE }}
          APP_LOCATION_IDENTIFIER: ${{ vars.APP_LOCATION_IDENTIFIER }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CUBE_API_URL: ${{ vars.CUBE_API_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          APP_API_FARM_IDENTIFIER: ${{ vars.APP_API_FARM_IDENTIFIER }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          # Repository secrets (Settings → Actions → Secrets)
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASS: ${{ secrets.APP_PASS }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ]; then
            echo "::error::APP_URL is empty — add repository variable APP_URL (not secret)"
            exit 1
          fi
          echo "Using APP_URL host: $(echo "$APP_URL" | sed -E 's|^(https?://[^/]+).*|\1|')"
          CMD=(npx playwright test)
          PROJECT="${{ github.event.inputs.project }}"
          GREP="${{ github.event.inputs.grep }}"
          if [ "$PROJECT" != "all" ]; then
            CMD+=(--project="$PROJECT")
          fi
          if [ -n "$GREP" ]; then
            CMD+=(--grep "$GREP")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: |
            reports/
            results/
          retention-days: 14

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          INPUT_PROJECT: ${{ github.event.inputs.project }}
          INPUT_GREP: ${{ github.event.inputs.grep }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          GIT_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          APP_URL_HOST: ${{ vars.APP_URL }}
        run: bash scripts/slack-e2e-notify.sh
