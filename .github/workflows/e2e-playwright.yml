# Manual E2E only — no run on push, PR, or merge.
name: E2E Playwright

on:
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project
        required: true
        default: all
        type: choice
        options:
          - all
          - farm
          - overview
          - i18n
      grep:
        description: Optional --grep (e.g. @contract, @health, @i18n)
        required: false
        default: ''
      dashboard_ref:
        description: xahwm-dashboard ref for locale JSON — must match APP_URL env (dev vs UAT)
        required: true
        default: revised-ui-version
        type: choice
        options:
          - revised-ui-version   # locales for online/dev APP_URL
          - staging              # locales for UAT APP_URL

permissions:
  id-token: write   # required for AWS OIDC assume-role
  contents: read
  actions: read     # list run artifacts for Slack HTML report link

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout e2e
        uses: actions/checkout@v4

      # Locale JSON for i18n specs (lib/i18n/locales.ts → DASHBOARD_ROOT).
      # Private sibling repo: set secret DASHBOARD_CHECKOUT_TOKEN (PAT with contents:read).
      - name: Checkout dashboard locales
        if: github.event.inputs.project == 'all' || github.event.inputs.project == 'i18n'
        uses: actions/checkout@v4
        with:
          repository: Xsights-Development/xahwm-dashboard
          ref: ${{ github.event.inputs.dashboard_ref }}
          path: xahwm-dashboard
          token: ${{ secrets.DASHBOARD_CHECKOUT_TOKEN || github.token }}
          sparse-checkout: |
            src/locales/lang
          sparse-checkout-cone-mode: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Session Manager plugin
        run: |
          set -euo pipefail
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: true
          # Locale JSON root for i18n (sibling checkout path)
          DASHBOARD_ROOT: ${{ github.workspace }}/xahwm-dashboard
          # Repository variables (Settings → Actions → Variables)
          APP_URL: ${{ vars.APP_URL }}
          APP_TENANT_IDENTIFIER: ${{ vars.APP_TENANT_IDENTIFIER }}
          APP_FARM_IDENTIFIER: ${{ vars.APP_FARM_IDENTIFIER }}
          APP_LOCATION_TYPE: ${{ vars.APP_LOCATION_TYPE }}
          APP_LOCATION_IDENTIFIER: ${{ vars.APP_LOCATION_IDENTIFIER }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CUBE_API_URL: ${{ vars.CUBE_API_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          APP_API_FARM_IDENTIFIER: ${{ vars.APP_API_FARM_IDENTIFIER }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          # Repository secrets (Settings → Actions → Secrets)
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASS: ${{ secrets.APP_PASS }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          # Staging DB (read-only) — Playwright reads to verify tests
          # Reached via SSM port-forward → connect over localhost, not the real host.
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STAGING_EC2_INSTANCE_ID: ${{ secrets.STAGING_EC2_INSTANCE_ID }}
          STAGING_DB_REMOTE_HOST: ${{ secrets.STAGING_DB_REMOTE_HOST }}   # real RDS endpoint (tunnel target)
          STAGING_DB_HOST: localhost                                # tests connect through the tunnel
          STAGING_DB_PORT: '5432'
          STAGING_DB_SSLMODE: require
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_READONLY_USER: ${{ secrets.STAGING_DB_READONLY_USER }}
          STAGING_DB_READONLY_PASS: ${{ secrets.STAGING_DB_READONLY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ]; then
            echo "::error::APP_URL is empty — add repository variable APP_URL (not secret)"
            exit 1
          fi

          PROJECT="${{ github.event.inputs.project }}"
          GREP="${{ github.event.inputs.grep }}"
          if [ "$PROJECT" = "all" ] || [ "$PROJECT" = "i18n" ]; then
            LOCALE_SAMPLE="${DASHBOARD_ROOT}/src/locales/lang/en.json"
            if [ ! -f "$LOCALE_SAMPLE" ]; then
              echo "::error::Missing $LOCALE_SAMPLE — checkout dashboard locales failed or dashboard_ref is wrong. For a private dashboard repo, add secret DASHBOARD_CHECKOUT_TOKEN."
              exit 1
            fi
            echo "DASHBOARD_ROOT=$DASHBOARD_ROOT (dashboard_ref=${{ github.event.inputs.dashboard_ref }})"
          fi

          # --- Open SSM port-forward to RDS in THIS shell so it lives for the test run ---
          aws ssm start-session \
            --target "$STAGING_EC2_INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$STAGING_DB_REMOTE_HOST\"],\"portNumber\":[\"5432\"],\"localPortNumber\":[\"5432\"]}" \
            > /tmp/ssm-tunnel.log 2>&1 &
          SSM_PID=$!
          # always kill the tunnel on exit (success or failure)
          trap 'kill "$SSM_PID" 2>/dev/null || true' EXIT
          # wait up to 30s for the local port (bash /dev/tcp — no nc dependency)
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then exec 3>&- 3<&-; echo "tunnel up"; break; fi
            if ! kill -0 "$SSM_PID" 2>/dev/null; then
              echo "::error::SSM session exited early"; cat /tmp/ssm-tunnel.log; exit 1
            fi
            sleep 1
          done
          if ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
            echo "::error::SSM tunnel did not open on localhost:5432"; cat /tmp/ssm-tunnel.log; exit 1
          fi
          exec 3>&- 3<&- 2>/dev/null || true
          echo "Using APP_URL host: $(echo "$APP_URL" | sed -E 's|^(https?://[^/]+).*|\1|')"
          CMD=(npx playwright test)
          if [ "$PROJECT" != "all" ]; then
            CMD+=(--project="$PROJECT")
          fi
          if [ -n "$GREP" ]; then
            CMD+=(--grep "$GREP")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: |
            reports/
            results/
          retention-days: 14

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve HTML report artifact URL
        if: always()
        id: report_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: playwright-report-${{ github.event.inputs.project }}-${{ github.run_number }}
        run: |
          set -euo pipefail
          FALLBACK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          URL="$FALLBACK"
          for _ in 1 2 3 4 5 6 7 8; do
            ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq ".artifacts[] | select(.name==\"${ARTIFACT_NAME}\") | .id" | head -n1 || true)
            if [ -n "${ID:-}" ]; then
              URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${ID}"
              break
            fi
            sleep 2
          done
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Report link: ${URL}"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          INPUT_PROJECT: ${{ github.event.inputs.project }}
          INPUT_GREP: ${{ github.event.inputs.grep }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.report_artifact.outputs.url }}
          ARTIFACT_NAME: ${{ steps.report_artifact.outputs.name }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          GIT_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          APP_URL_HOST: ${{ vars.APP_URL }}
        run: bash scripts/slack-e2e-notify.sh
